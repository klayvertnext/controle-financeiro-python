<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Financeiro - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 35px 30px 30px 30px;
            background: var(--bs-card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--bs-border-color);
            position: relative;
        }
        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            font-size: 1.25rem;
            color: var(--bs-body-color);
            cursor: pointer;
            padding: 5px;
            line-height: 1;
            z-index: 10;
        }
        .theme-toggle:focus {
            outline: none;
        }
        .form-control {
            padding: 10px 12px;
            font-size: 14px;
        }
        .btn-primary {
            padding: 11px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <button class="theme-toggle" id="btnToggleTheme" title="Alternar modo claro/escuro" type="button">
            <i class="bi bi-moon-fill" id="themeIcon"></i>
        </button>

        <div class="text-center mb-4 mt-1">
            <h3 class="fw-bold text-primary">K-Financeiro</h3>
            <p class="text-muted small">Acesse sua conta para continuar</p>
        </div>

        {% if erro %}
            <div class="alert alert-danger py-2 text-center small" role="alert">
                {{ erro }}
            </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label for="identificador" class="form-label small fw-bold text-secondary">Nome de Usuário ou E-mail</label>
                <input type="text" class="form-control" id="identificador" name="identificador" placeholder="Ex: Joao@123 ou email@gmail.com" required autofocus>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label small fw-bold text-secondary">Senha</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="senha" name="senha" placeholder="Sua senha" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggleSenha" title="Ver ou ocultar senha">
                        <i class="bi bi-eye" id="iconOlho"></i>
                    </button>
                </div>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary rounded-pill shadow-sm">Entrar</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <p class="small text-muted">Ainda não tem uma conta? <a href="/cadastro" class="text-decoration-none fw-bold">Cadastre-se</a></p>
        </div>
    </div>

    <script>
        const btnToggleTheme = document.getElementById('btnToggleTheme');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'light';
        
        htmlElement.setAttribute('data-bs-theme', savedTheme);
        atualizarIconeTema(savedTheme);

        btnToggleTheme.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            atualizarIconeTema(newTheme);
        });

        function atualizarIconeTema(theme) {
            themeIcon.className = theme === 'dark' ? 'bi bi-sun-fill text-warning' : 'bi bi-moon-fill text-secondary';
        }

        const inputSenha = document.getElementById('senha');
        const btnToggleSenha = document.getElementById('toggleSenha');
        const iconOlho = document.getElementById('iconOlho');

        btnToggleSenha.addEventListener('click', () => {
            if (inputSenha.type === 'password') {
                inputSenha.type = 'text';
                iconOlho.className = 'bi bi-eye-slash';
            } else {
                inputSenha.type = 'password';
                iconOlho.className = 'bi bi-eye';
            }
        });
    </script>
</body>
</html>
