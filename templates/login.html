<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - K$ Financeiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#080a11] text-slate-100 flex items-center justify-center p-4">
  <main class="w-full max-w-md bg-slate-900/80 border border-slate-800 rounded-3xl p-8 shadow-2xl">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 text-white font-black text-2xl mb-4">K$</div>
      <h1 class="text-2xl font-bold">Bem-vindo de volta</h1>
      <p class="text-slate-400 text-sm mt-1">Acesse sua conta para gerenciar finanças.</p>
    </div>

    <div id="errorMessage" class="hidden mb-4 p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400 text-xs text-center font-medium"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs uppercase font-bold text-slate-300 mb-1">Usuário</label>
        <input type="text" id="username" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-xs uppercase font-bold text-slate-300 mb-1">Senha</label>
        <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
      </div>

      <button type="submit" id="submitBtn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/30">
        Entrar na conta
      </button>
    </form>

    <footer class="mt-6 text-center text-sm text-slate-400">
      Não tem conta? <a href="/cadastro" class="text-indigo-400 hover:underline font-semibold">Criar nova conta</a>
    </footer>
  </main>

  <script>
    lucide.createIcons();
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const errBox = document.getElementById('errorMessage');
      
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: user, senha: pass })
        });
        const data = await res.json();
        if (res.ok && data.status === 'sucesso') {
          window.location.href = data.redirect || '/dashboard';
        } else {
          errBox.textContent = data.mensagem || 'Erro ao autenticar.';
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        errBox.textContent = 'Erro de conexão com o servidor.';
        errBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
