<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - K$ Financeiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'pulse-glow': 'pulseGlow 4s ease-in-out infinite alternate',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(12px) scale(0.98)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
            pulseGlow: {
              '0%': { opacity: '0.2' },
              '100%': { opacity: '0.4' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #090d16;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4 relative overflow-x-hidden select-none">

  <div class="fixed inset-0 pointer-events-none z-0">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-brand-500/10 rounded-full blur-3xl animate-pulse-glow"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl animate-pulse-glow" style="animation-delay: 2s;"></div>
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#1f29370a_1px,transparent_1px),linear-gradient(to_bottom,#1f29370a_1px,transparent_1px)] bg-[size:4rem_4rem]"></div>
  </div>

  <main class="w-full max-w-lg bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-2xl shadow-2xl p-8 sm:p-10 relative z-10 animate-fade-in-up transition-all duration-300">
    
    <header class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 shadow-lg shadow-brand-500/20 mb-4 transition-transform hover:scale-105 duration-200">
        <span class="text-2xl font-black text-slate-950 tracking-wider">K$</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">Bem-vindo de volta</h1>
      <p class="text-slate-400 text-sm sm:text-base">Acesse sua conta para continuar gerenciando suas finanças.</p>
    </header>

    <form id="loginForm" action="/login" method="POST" class="space-y-6">
      
      <div class="space-y-2">
        <label for="username" class="block text-xs uppercase font-semibold text-slate-300 tracking-wider">Usuário</label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 group-focus-within:text-brand-500 transition-colors duration-200">
            <i data-lucide="user" class="w-5 h-5"></i>
          </div>
          <input 
            type="text" 
            id="username" 
            name="username" 
            required 
            placeholder="Digite seu usuário"
            class="w-full pl-11 pr-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all duration-200 text-sm"
          >
        </div>
      </div>

      <div class="space-y-2">
        <label for="password" class="block text-xs uppercase font-semibold text-slate-300 tracking-wider">Senha</label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 group-focus-within:text-brand-500 transition-colors duration-200">
            <i data-lucide="lock" class="w-5 h-5"></i>
          </div>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            placeholder="••••••••"
            class="w-full pl-11 pr-11 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all duration-200 text-sm"
          >
          <button 
            type="button" 
            id="togglePassword"
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 focus:outline-none transition-colors duration-200"
            aria-label="Mostrar ou ocultar senha"
          >
            <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <button 
        type="submit" 
        id="submitBtn"
        class="w-full py-3.5 px-4 bg-gradient-to-r from-brand-600 to-emerald-500 hover:from-brand-500 hover:to-emerald-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-brand-500/20 hover:shadow-brand-500/30 transition-all duration-200 active:scale-[0.98] flex items-center justify-center space-x-2 disabled:opacity-70 disabled:cursor-not-allowed"
      >
        <span id="btnText">Entrar</span>
        <i data-lucide="arrow-right" id="btnIcon" class="w-4 h-4 transition-transform group-hover:translate-x-1"></i>
        <div id="btnSpinner" class="hidden w-5 h-5 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></div>
      </button>

    </form>

    <footer class="mt-8 pt-6 border-t border-slate-800/80 text-center">
      <p class="text-sm text-slate-400">
        Ainda não possui uma conta? 
        <a href="/cadastro" class="font-semibold text-brand-500 hover:text-brand-400 transition-colors duration-200 underline-offset-4 hover:underline">
          Criar nova conta
        </a>
      </p>
    </footer>

  </main>

  <script>
    // Inicializar Ícones Lucide
    lucide.createIcons();

    // Toggle Mostrar/Ocultar Senha
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      
      if (type === 'text') {
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    });

    // Animação de Loading no Submit
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const btnSpinner = document.getElementById('btnSpinner');

    form.addEventListener('submit', () => {
      submitBtn.disabled = true;
      btnText.textContent = "Entrando...";
      if (btnIcon) btnIcon.classList.add('hidden');
      btnSpinner.classList.remove('hidden');
    });
  </script>
</body>
</html>
