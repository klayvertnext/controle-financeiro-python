<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Financeiro - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .register-card {
            width: 100%;
            max-width: 420px;
            padding: 35px 30px 30px 30px;
            background: var(--bs-card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--bs-border-color);
            position: relative;
        }
        /* Botão de Alternar Modo Claro/Escuro fixo no canto superior direito */
        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            font-size: 1.25rem;
            color: var(--bs-body-color);
            cursor: pointer;
            padding: 5px;
            line-height: 1;
            z-index: 10;
        }
        .theme-toggle:focus {
            outline: none;
        }
        .form-control {
            padding: 10px 12px;
            font-size: 14px;
        }
        .btn-primary {
            padding: 11px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <button class="theme-toggle" id="btnToggleTheme" title="Alternar modo claro/escuro" type="button">
            <i class="bi bi-moon-fill" id="themeIcon"></i>
        </button>

        <div class="text-center mb-4 mt-1">
            <h3 class="fw-bold text-primary">K-Financeiro</h3>
            <p class="text-muted small">Crie sua conta preenchendo os dados abaixo</p>
        </div>

        {% if erro %}
            <div class="alert alert-danger py-2 text-center small" role="alert" id="servidorErro">
                {{ erro }}
            </div>
        {% endif %}

        <div class="alert alert-warning py-2 text-center small d-none" role="alert" id="msgAlerta"></div>

        <form action="/cadastro" method="POST" id="formCadastro" onsubmit="return validarFormulario(event)">
            <div class="mb-3">
                <label for="nome" class="form-label small fw-bold text-secondary">Nome de Usuário</label>
                <input type="text" class="form-control" id="nome" name="nome" placeholder="Ex: Joao@123" required autocomplete="off" autofocus>
                <div class="form-text text-muted" style="font-size: 11px;">
                    Obrigatório conter ao menos <strong>1 letra maiúscula</strong> e <strong>1 símbolo</strong> (ex: @, #, $, %).
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label small fw-bold text-secondary">E-mail (Gmail)</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="seuemail@gmail.com" required autocomplete="email">
                <div class="form-text text-muted" style="font-size: 11px;">
                    Deve ser um endereço válido exclusivo do <strong>@gmail.com</strong>.
                </div>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label small fw-bold text-secondary">Senha</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="senha" name="senha" placeholder="Mínimo 7 dígitos" required autocomplete="new-password">
                    <button class="btn btn-outline-secondary" type="button" id="toggleSenha" title="Ver ou ocultar senha">
                        <i class="bi bi-eye" id="iconOlho"></i>
                    </button>
                </div>
                <div class="form-text text-muted" style="font-size: 11px;">
                    Mínimo de <strong>7 caracteres</strong>.
                </div>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary rounded-pill shadow-sm">Cadastrar Conta</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <p class="small text-muted">Já tem uma conta? <a href="/login" class="text-decoration-none fw-bold">Faça login</a></p>
        </div>
    </div>

    <script>
        // 1. Alternar Tema Claro / Escuro
        const btnToggleTheme = document.getElementById('btnToggleTheme');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        const savedTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-bs-theme', savedTheme);
        atualizarIconeTema(savedTheme);

        btnToggleTheme.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            atualizarIconeTema(newTheme);
        });

        function atualizarIconeTema(theme) {
            if (theme === 'dark') {
                themeIcon.className = 'bi bi-sun-fill text-warning';
            } else {
                themeIcon.className = 'bi bi-moon-fill text-secondary';
            }
        }

        // 2. Ver / Ocultar Senha
        const inputSenha = document.getElementById('senha');
        const btnToggleSenha = document.getElementById('toggleSenha');
        const iconOlho = document.getElementById('iconOlho');

        btnToggleSenha.addEventListener('click', () => {
            if (inputSenha.type === 'password') {
                inputSenha.type = 'text';
                iconOlho.className = 'bi bi-eye-slash';
            } else {
                inputSenha.type = 'password';
                iconOlho.className = 'bi bi-eye';
            }
        });

        // 3. Validação do Formulário no Envio
        function validarFormulario(event) {
            const nomeInput = document.getElementById('nome').value.trim();
            const emailInput = document.getElementById('email').value.trim().toLowerCase();
            const senhaInput = document.getElementById('senha').value;
            const msgAlerta = document.getElementById('msgAlerta');

            const servidorErro = document.getElementById('servidorErro');
            if (servidorErro) servidorErro.style.display = 'none';

            // Regra 1: Nome de Usuário (Maiúscula + Símbolo)
            const temMaiuscula = /[A-Z]/.test(nomeInput);
            const temSimbolo = /[^a-zA-Z0-9\s]/.test(nomeInput);

            if (!temMaiuscula || !temSimbolo) {
                event.preventDefault();
                msgAlerta.innerText = "O nome de usuário precisa conter ao menos 1 letra maiúscula e 1 símbolo (ex: @, #, $, %).";
                msgAlerta.classList.remove('d-none');
                return false;
            }

            // Regra 2: E-mail deve ser exclusivamente @gmail.com
            if (!emailInput.endsWith('@gmail.com')) {
                event.preventDefault();
                msgAlerta.innerText = "O e-mail deve ser um endereço válido do Gmail (@gmail.com).";
                msgAlerta.classList.remove('d-none');
                return false;
            }

            // Regra 3: Senha no mínimo 7 caracteres
            if (senhaInput.length < 7) {
                event.preventDefault();
                msgAlerta.innerText = "A senha deve ter no mínimo 7 caracteres.";
                msgAlerta.classList.remove('d-none');
                return false;
            }

            msgAlerta.classList.add('d-none');
            return true;
        }
    </script>
</body>
</html>
