<!DOCTYPE html><html lang="pt-br" data-bs-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | Controle Financeiro</title><script>document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('theme')||'light')</script><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"><link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}"></head><body>
<main class="auth-shell"><section class="brand-panel"><div class="brand-logo"><div class="logo-symbol">K<span>$</span></div><div class="logo-title">CONTROLE <span>FINANCEIRO</span></div><div class="logo-tagline">ORGANIZE. PLANEJE. CONQUISTE.</div></div></section><section class="form-panel"><button class="theme-toggle" id="btnToggleTheme" aria-label="Alternar tema"><i class="bi bi-moon-fill" id="themeIcon"></i></button><div class="auth-card"><div class="eyebrow">Comece hoje</div><h1 class="auth-title">Organize. Planeje. Conquiste.</h1><p class="auth-subtitle">Crie sua conta e tenha uma visão simples e completa das suas finanças.</p>
{% if erro %}<div class="alert alert-danger py-2 small" id="servidorErro">{{ erro }}</div>{% endif %}<div class="alert alert-warning py-2 small d-none" id="msgAlerta"></div>
<form action="/cadastro" method="POST" id="formCadastro" onsubmit="return validarFormulario(event)"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label for="nome" class="form-label">Nome de usuário</label><input class="form-control" id="nome" name="nome" placeholder="Como deseja ser chamado" minlength="3" required autocomplete="username" autofocus><div class="form-text">Use entre 3 e 100 caracteres.</div></div><div class="mb-3"><label for="email" class="form-label">E-mail</label><input type="email" class="form-control" id="email" name="email" placeholder="voce@exemplo.com" required autocomplete="email"></div><div class="mb-3"><label for="senha" class="form-label">Senha</label><div class="input-group"><input type="password" class="form-control" id="senha" name="senha" placeholder="Mínimo de 12 caracteres" minlength="12" required autocomplete="new-password"><button class="btn btn-outline-secondary" type="button" id="toggleSenha" aria-label="Mostrar senha"><i class="bi bi-eye" id="iconOlho"></i></button></div></div><button type="submit" class="btn btn-brand w-100 mt-3">Criar minha conta</button></form><p class="auth-footer text-center small mt-4">Já possui uma conta? <a href="/login">Entrar agora</a></p></div></section></main>
<script>const root=document.documentElement,icon=document.getElementById('themeIcon');function sync(t){root.setAttribute('data-bs-theme',t);icon.className=t==='dark'?'bi bi-sun-fill':'bi bi-moon-fill'}sync(localStorage.getItem('theme')||'light');document.getElementById('btnToggleTheme').onclick=()=>{const t=root.getAttribute('data-bs-theme')==='light'?'dark':'light';localStorage.setItem('theme',t);sync(t)};document.getElementById('toggleSenha').onclick=()=>{const input=document.getElementById('senha'),eye=document.getElementById('iconOlho');input.type=input.type==='password'?'text':'password';eye.className=input.type==='password'?'bi bi-eye':'bi bi-eye-slash'};function validarFormulario(e){const n=document.getElementById('nome').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),senha=document.getElementById('senha').value,msg=document.getElementById('msgAlerta');const server=document.getElementById('servidorErro');if(server)server.style.display='none';let erro='';if(n.length<3)erro='O nome precisa ter pelo menos 3 caracteres.';else if(!email.includes('@'))erro='Informe um endereço de e-mail válido.';else if(senha.length<12)erro='A senha deve ter no mínimo 12 caracteres.';if(erro){e.preventDefault();msg.textContent=erro;msg.classList.remove('d-none');return false}return true}</script></body></html>
