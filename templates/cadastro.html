<!DOCTYPE html>
<html lang="pt-BR" id="htmlRoot" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - K$ Financeiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body id="bodyRoot" class="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-center items-center px-4 transition-colors duration-200">

  <div class="absolute top-4 right-4">
    <button onclick="toggleTheme()" class="p-2.5 bg-slate-900 dark:bg-slate-900 bg-white border border-slate-300 dark:border-slate-800 text-slate-700 dark:text-slate-300 rounded-xl shadow-md transition-colors" title="Alternar Tema">
      <i data-lucide="sun" id="themeIcon" class="w-5 h-5"></i>
    </button>
  </div>

  <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 shadow-xl transition-colors">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center font-black text-white text-xl mx-auto mb-3 shadow-lg shadow-indigo-600/30">K$</div>
      <h2 class="text-lg font-bold text-slate-900 dark:text-slate-100">Criar Nova Conta</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Comece a gerenciar suas finanças hoje</p>
    </div>

    <form method="POST" action="/cadastro">
    <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" name="nome" required>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" required>
    </div>
    <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="senha" name="senha" required>
    </div>
    <button type="submit" class="btn btn-primary">Cadastrar</button>
</form>

    <div class="mt-6 text-center text-xs text-slate-500 dark:text-slate-400">
      Já tem uma conta? <a href="/login" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">Faça login</a>
    </div>
  </div>

  <script>
    function updateIcon() {
      const isDark = document.getElementById('htmlRoot').classList.contains('dark');
      const icon = document.getElementById('themeIcon');
      if (icon) {
        icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
        lucide.createIcons();
      }
    }

    function toggleTheme() {
      const html = document.getElementById('htmlRoot');
      const body = document.getElementById('bodyRoot');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        body.className = "min-h-screen bg-slate-100 text-slate-900 flex flex-col justify-center items-center px-4 transition-colors duration-200";
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        body.className = "min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-center items-center px-4 transition-colors duration-200";
        localStorage.setItem('theme', 'dark');
      }
      updateIcon();
    }

    if (localStorage.getItem('theme') === 'light') {
      document.getElementById('htmlRoot').classList.remove('dark');
      document.getElementById('bodyRoot').className = "min-h-screen bg-slate-100 text-slate-900 flex flex-col justify-center items-center px-4 transition-colors duration-200";
    }
    document.addEventListener('DOMContentLoaded', updateIcon);
  </script>
</body>
</html>
