<!DOCTYPE html>
<html lang="pt-BR" id="htmlRoot" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - K$ Financeiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 dark:bg-slate-950 dark:text-slate-100 flex flex-col justify-center items-center px-4 transition-colors duration-200">

  <div class="absolute top-4 right-4">
    <button onclick="toggleTheme()" class="p-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 rounded-xl shadow-md transition-colors" title="Alternar Tema">
      <i data-lucide="sun" id="themeIcon" class="w-5 h-5"></i>
    </button>
  </div>

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center font-black text-white text-xl mx-auto mb-3 shadow-lg shadow-indigo-600/30">K$</div>
      <h2 class="text-lg font-bold text-slate-100">Criar Nova Conta</h2>
      <p class="text-xs text-slate-400 mt-1">Comece a gerenciar suas finanças hoje</p>
    </div>

    <form action="/cadastro" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Novo Usuário</label>
        <input type="text" name="usuario" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Senha</label>
        <input type="password" name="senha" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
      </div>
      <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-xs transition-all shadow-md shadow-indigo-600/20">Cadastrar</button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-400">
      Já tem uma conta? <a href="/login" class="text-indigo-400 font-semibold hover:underline">Faça login</a>
    </div>
  </div>

  <script>
    function updateIcon() {
      const isDark = document.getElementById('htmlRoot').classList.contains('dark');
      const icon = document.getElementById('themeIcon');
      icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      lucide.createIcons();
    }

    function toggleTheme() {
      const html = document.getElementById('htmlRoot');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
      updateIcon();
    }

    if (localStorage.getItem('theme') === 'light') {
      document.getElementById('htmlRoot').classList.remove('dark');
    }
    document.addEventListener('DOMContentLoaded', updateIcon);
  </script>
</body>
</html>
