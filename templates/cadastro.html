<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K$ - Criar Conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slateBg: '#0F172A',
                        cardBg: '#1E293B',
                        brandBlue: '#0284C7'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slateBg text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-cardBg border border-slate-700 rounded-2xl p-8 max-w-sm w-full shadow-2xl space-y-5">
        <div class="text-center">
            <h1 class="text-4xl font-black text-brandBlue">K$</h1>
            <h2 class="text-base font-bold mt-1">Criar Nova Conta</h2>
            <p class="text-[11px] text-slate-400 mt-2 leading-tight">
                🔒 Requisitos:<br>
                • Usuário: 1 maiúscula + 1 número<br>
                • Senha: mín. 7 caracteres
            </p>
        </div>

        <div id="erro-msg" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 text-xs p-3 rounded-lg text-center"></div>

        <form id="form-cadastro" class="space-y-3" onsubmit="fazerCadastro(event)">
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">Usuário (ex: Klayvert1)</label>
                <input type="text" id="usuario" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brandBlue transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">Senha</label>
                <input type="password" id="senha" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brandBlue transition">
            </div>

            <button type="submit" class="w-full bg-brandBlue hover:bg-sky-600 font-bold py-2.5 rounded-lg transition text-white shadow-lg mt-2">
                Cadastrar e Entrar
            </button>
        </form>

        <div class="text-center">
            <a href="/login" class="text-xs text-slate-400 hover:text-white transition">Voltar ao Login</a>
        </div>
    </div>

    <script>
        async function fazerCadastro(e) {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;
            const erroDiv = document.getElementById('erro-msg');

            erroDiv.classList.add('hidden');

            const res = await fetch('/cadastro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, senha })
            });

            const data = await res.json();

            if (res.ok) {
                window.location.href = '/dashboard';
            } else {
                erroDiv.innerText = data.mensagem || 'Erro no cadastro.';
                erroDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
