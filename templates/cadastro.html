<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Financeiro - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .register-card {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        .form-control {
            padding: 12px;
            font-size: 14px;
        }
        .btn-primary {
            padding: 12px;
            font-weight: 600;
            background-color: #0d6efd;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">K-Financeiro</h3>
            <p class="text-muted small">Crie sua nova conta para começar</p>
        </div>

        {% if erro %}
            <div class="alert alert-danger py-2 text-center small" role="alert">
                {{ erro }}
            </div>
        {% endif %}

        <form action="/cadastro" method="POST">
            <div class="mb-3">
                <label for="nome" class="form-label small fw-bold text-secondary">Nome Completo</label>
                <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome" required autofocus>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label small fw-bold text-secondary">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label small fw-bold text-secondary">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" placeholder="••••••••" required>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary rounded-pill shadow-sm">Cadastrar Conta</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <p class="small text-muted">Já tem uma conta? <a href="/login" class="text-decoration-none fw-bold">Faça login</a></p>
        </div>
    </div>

</body>
</html>
