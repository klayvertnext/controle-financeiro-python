<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - K$ Financeiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { background-color: #0b0f19; font-family: system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col antialiased">

  <header class="w-full border-b border-slate-800 bg-slate-900/80 sticky top-0 z-30 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-white text-lg">K$</div>
        <h1 class="text-sm sm:text-base font-bold text-white">Olá, <span id="userNameHeader" class="text-indigo-400">Usuário</span></h1>
      </div>
      <div class="flex items-center space-x-3">
        <select id="monthSelect" class="bg-slate-950 border border-slate-700 text-slate-100 text-xs py-2 px-3 rounded-lg focus:outline-none">
          <option value="7" selected>Julho de 2026</option>
        </select>
        <a href="/logout" class="px-3 py-2 bg-slate-800 border border-slate-700 text-slate-300 hover:text-rose-400 rounded-lg text-xs flex items-center space-x-1">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span>Sair</span>
        </a>
      </div>
    </div>
  </header>

  <div class="border-b border-slate-800 bg-slate-900/40">
    <div class="max-w-6xl mx-auto px-4 flex space-x-6">
      <button id="tabDashboard" onclick="switchTab('dashboard')" class="py-3 px-1 border-b-2 border-indigo-500 text-indigo-400 font-semibold text-xs sm:text-sm flex items-center space-x-2">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
        <span>Dashboard & Rendas</span>
      </button>
      <button id="tabCards" onclick="switchTab('cards')" class="py-3 px-1 border-b-2 border-transparent text-slate-400 hover:text-slate-200 font-medium text-xs sm:text-sm flex items-center space-x-2">
        <i data-lucide="credit-card" class="w-4 h-4"></i>
        <span>Cartões & Saídas</span>
      </button>
    </div>
  </div>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">

    <section id="sectionDashboard" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
          <span class="text-xs font-bold uppercase text-slate-400">Renda Total</span>
          <div class="text-2xl font-extrabold text-white mt-2" id="valRendaTotal">R$ 0,00</div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
          <span class="text-xs font-bold uppercase text-slate-400">Saídas do Mês</span>
          <div class="text-2xl font-extrabold text-white mt-2" id="valSaidasTotal">R$ 0,00</div>
        </div>
        <div class="bg-slate-900 border border-indigo-500/40 rounded-2xl p-5">
          <span class="text-xs font-bold uppercase text-indigo-300">Saldo Livre</span>
          <div class="text-2xl font-extrabold text-white mt-2" id="valSaldoLivre">R$ 0,00</div>
        </div>
      </div>
    </section>

    <section id="sectionCards" class="hidden space-y-6">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-md">
        <h2 class="text-base font-bold text-white mb-1">Cadastrar novo cartão</h2>
        <form id="formCartao" onsubmit="cadastrarCartao(event)" class="space-y-3 mt-3">
          <div>
            <label class="block text-xs uppercase font-bold text-slate-300 mb-1">Nome do Cartão</label>
            <input type="text" id="cartaoNome" placeholder="Ex: Nubank" required class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-slate-100">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs uppercase font-bold text-slate-300 mb-1">Limite (R$)</label>
              <input type="number" step="0.01" id="cartaoLimite" placeholder="0,00" required class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-slate-100">
            </div>
            <div>
              <label class="block text-xs uppercase font-bold text-slate-300 mb-1">Vencimento</label>
              <input type="number" min="1" max="31" id="cartaoVencimento" placeholder="10" required class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-slate-100">
            </div>
          </div>
          <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-xs transition-all">Salvar Cartão</button>
        </form>
      </div>
    </section>

  </main>

  <script>
    lucide.createIcons();

    function switchTab(tab) {
      const secDash = document.getElementById('sectionDashboard');
      const secCards = document.getElementById('sectionCards');
      const tabDash = document.getElementById('tabDashboard');
      const tabCards = document.getElementById('tabCards');

      if (tab === 'dashboard') {
        secDash.classList.remove('hidden');
        secCards.classList.add('hidden');
        tabDash.className = "py-3 px-1 border-b-2 border-indigo-500 text-indigo-400 font-semibold text-xs sm:text-sm flex items-center space-x-2";
        tabCards.className = "py-3 px-1 border-b-2 border-transparent text-slate-400 hover:text-slate-200 font-medium text-xs sm:text-sm flex items-center space-x-2";
      } else {
        secCards.classList.remove('hidden');
        secDash.classList.add('hidden');
        tabCards.className = "py-3 px-1 border-b-2 border-indigo-500 text-indigo-400 font-semibold text-xs sm:text-sm flex items-center space-x-2";
        tabDash.className = "py-3 px-1 border-b-2 border-transparent text-slate-400 hover:text-slate-200 font-medium text-xs sm:text-sm flex items-center space-x-2";
      }
    }

    async function cadastrarCartao(e) {
      e.preventDefault();
      const nome = document.getElementById('cartaoNome').value.trim();
      const limite = parseFloat(document.getElementById('cartaoLimite').value) || 0;
      const diaVencimento = parseInt(document.getElementById('cartaoVencimento').value) || 1;

      try {
        const response = await fetch('/cadastrar_cartao', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, limite, dia_vencimento })
        });
        const data = await response.json();

        if (response.ok && data.status === 'sucesso') {
          document.getElementById('formCartao').reset();
          alert("Cartão cadastrado com sucesso!");
        } else {
          alert(data.mensagem || "Erro ao cadastrar cartão.");
        }
      } catch (err) {
        alert("Erro ao conectar com o servidor.");
      }
    }
  </script>
</body>
</html>
